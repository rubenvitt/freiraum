# Xcode-Projekt für Freiraum (iOS und macOS). Erzeugen mit `xcodegen generate` in apple/.
# Persönliche Werte (Team, Bundle-Präfix, Domain) stehen in Config/Local.xcconfig, nicht im Repo.
name: Freiraum
options:
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  developmentLanguage: de
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Freiraum.xcconfig
  Release: Config/Freiraum.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  FreiraumKit:
    path: FreiraumKit
  # Automatische Updates der Mac-App (nur macOS gelinkt, siehe Abhängigkeit am Ziel Freiraum).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  Freiraum:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - Freiraum
    dependencies:
      - package: FreiraumKit
      - package: Sparkle
        destinationFilters: [macOS]
      - target: FreiraumWidget
        destinationFilters: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FREIRAUM_BUNDLE_PREFIX).freiraum
        PRODUCT_NAME: Freiraum
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Freiraum/Freiraum.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Freiraum/Freiraum-macOS.entitlements
        # Signaturidentität am Mac nur für die App (nicht für Swift-Pakete und Build-Plugins).
        # Lokal „Apple Development“, im Release-Workflow „Developer ID Application“.
        "CODE_SIGN_IDENTITY[sdk=macosx*]": $(FREIRAUM_MAC_SIGN_IDENTITY)
        # XcodeGen übernimmt für das gemeinsame Target die iOS-Voreinstellung
        # „@executable_path/Frameworks“; am Mac liegen Frameworks in Contents/Frameworks.
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Freiraum/Info.plist
      properties:
        CFBundleDisplayName: Freiraum
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.finance
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [$(PRODUCT_BUNDLE_IDENTIFIER).refresh]
        FreiraumDomain: $(FREIRAUM_DOMAIN)
        FreiraumAppGroup: group.$(FREIRAUM_BUNDLE_PREFIX).freiraum
        # Sparkle (nur macOS ausgewertet). Feed und Schlüssel setzt der Release-Build über
        # Local.xcconfig; leer bleibt die Update-Prüfung aus (Updater.swift).
        SUFeedURL: $(FREIRAUM_UPDATE_FEED)
        SUPublicEDKey: $(FREIRAUM_SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 3600
        SUEnableInstallerLauncherService: true
  FreiraumWidget:
    type: app-extension
    platform: iOS
    sources:
      - FreiraumWidget
    dependencies:
      - package: FreiraumKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FREIRAUM_BUNDLE_PREFIX).freiraum.widget
        PRODUCT_NAME: FreiraumWidget
        CODE_SIGN_ENTITLEMENTS: FreiraumWidget/FreiraumWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: FreiraumWidget/Info.plist
      properties:
        CFBundleDisplayName: Freiraum
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        FreiraumAppGroup: group.$(FREIRAUM_BUNDLE_PREFIX).freiraum
schemes:
  Freiraum:
    build:
      targets:
        Freiraum: all
    run:
      config: Debug
    archive:
      config: Release
