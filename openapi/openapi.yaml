          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Haushalt nicht gefunden (oder kein Zugriff)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - Kategorisierung
      summary: Regel von Hand anlegen und auf offene Buchungen anwenden
      description: Alle gesetzten Merkmale müssen passen. Bei mehreren Treffern gewinnt die spezifischste Regel, bei Gleichstand die zuletzt geänderte. Gleiche Merkmale ersetzen eine bestehende Regel.
