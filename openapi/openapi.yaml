  /v1/households/{householdId}/settlements:
    get:
      tags:
        - Paar
      summary: "Ausgleich: was das Gemeinsame und die Personen einander schulden"
      description: Eine Forderung entsteht, wenn eine Buchung eines privaten Kontos einem Topf des gemeinsamen Haushalts zugeordnet wird. Erledigt wird sie durch eine Überweisung vom gemeinsamen Konto (Art ausgleich) oder von Hand. Eine Schuld entsteht umgekehrt, wenn eine Buchung des gemeinsamen Kontos dem privaten Topf einer Person zugeordnet wird; sie zahlt sie per Überweisung aufs gemeinsame Konto (Art ausgleich) zurück. Forderung und Schuld verrechnen sich; Erstattungen decken der Reihe nach, älteste zuerst.
      security: *a1
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: householdId
          in: path
      responses:
        "200":
          description: Stand des Ausgleichs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settlements"
        "400":
          description: Ungültige Anfrage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Haushalt nicht gefunden (oder kein Zugriff)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Kein gemeinsamer Haushalt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - Paar
      summary: Ausgleich von Hand verbuchen oder mit der Einzahlung verrechnen
      description: "Nur für den eigenen Saldo und höchstens so viel, wie offen ist. Eine Zahlung (z. B. bar erhalten) gibt es nur für eine Forderung. Eine Verrechnung geht in beide Richtungen und ergibt sich aus dem Saldo: Bei einer Forderung zählt sie als Erstattung und als zusätzliche Einzahlung (450 € überwiesen + 50 € verrechnet = 500 € Ist), bei einer Schuld als Rückzahlung und als geringere Einzahlung. Sie ändert das private Budget der Person und geht deshalb nicht in abgeschlossenen Monaten und nicht vor dem Budgetbeginn."
      security: *a1
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: householdId
          in: path
      requestBody:
        description: Erhaltener Betrag
        content:
          application/json:
            schema:
              type: object
              properties:
                amountCents:
                  type: integer
                  minimum: 1
                  maximum: 100000000000
                kind:
                  type: string
                  enum:
                    - zahlung
                    - verrechnung
                  description: "Standard: zahlung"
                settledOn:
                  type: string
                  format: date
                  example: 2026-11-03
                  description: "Standard: heute; bei verrechnung zählt der Monat für Ist und Budget"
                note:
                  type: string
                  maxLength: 300
              required:
                - amountCents
      responses:
        "201":
          description: Stand des Ausgleichs danach
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settlements"
        "400":
          description: Ungültige Anfrage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Haushalt nicht gefunden (oder kein Zugriff)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Verrechnung in einem abgeschlossenen Monat oder vor dem Budgetbeginn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Kein gemeinsamer Haushalt oder mehr als offen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
