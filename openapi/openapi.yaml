                $ref: "#/components/schemas/Error"
        "404":
          description: Haushalt nicht gefunden (oder kein Zugriff)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Kein Merkmal, Topf oder Konto aus anderem Haushalt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
