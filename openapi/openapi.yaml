# Erzeugt von backend/src/openapi-export.ts – nicht von Hand ändern.
openapi: 3.1.0
info:
  title: Freiraum API
  version: 0.1.0
  description: Backend von Freiraum. Beträge immer als ganze Cent (Integer). Anmeldung nur per Passkey nach Einladung.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Sitzungs-Token aus /v1/auth/…/verify
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
        database:
          type: string
          enum:
            - ok
      required:
        - status
        - database
    RegistrationStart:
      type: object
      properties:
        challengeId:
          type: string
          format: uuid
          description: Kennung der Anfrage aus …/options
        options:
          $ref: "#/components/schemas/RegistrationOptions"
      required:
        - challengeId
        - options
    RegistrationOptions:
      type: object
      properties:
        challenge:
          type: string
          pattern: ^[A-Za-z0-9_-]*$
        rp:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
          required:
            - name
        user:
          type: object
          properties:
            id:
              type: string
              pattern: ^[A-Za-z0-9_-]*$
            name:
              type: string
            displayName:
              type: string
          required:
            - id
            - name
            - displayName
        pubKeyCredParams:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                example: public-key
              alg:
                type: integer
            required:
              - type
              - alg
        timeout:
          type: integer
        excludeCredentials:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                pattern: ^[A-Za-z0-9_-]*$
              type:
                type: string
                example: public-key
              transports:
                type: array
                items:
                  type: string
                  example: internal
            required:
              - id
              - type
        authenticatorSelection:
          type: object
          properties:
            residentKey:
              type: string
            userVerification:
              type: string
          additionalProperties: {}
        attestation:
          type: string
      required:
        - challenge
        - rp
        - user
        - pubKeyCredParams
      additionalProperties: {}
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: nicht_angemeldet
            message:
              type: string
              example: Bitte melde dich an.
          required:
            - code
            - message
      required:
        - error
    Session:
      type: object
      properties:
        token:
          type: string
          description: Bearer-Token für den Header Authorization
        expiresAt:
          type: string
          format: date-time
        person:
          $ref: "#/components/schemas/Person"
      required:
        - token
        - expiresAt
        - person
    Person:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          example: Person A
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - displayName
        - createdAt
    RegistrationCredential:
      type: object
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]*$
        rawId:
          type: string
          pattern: ^[A-Za-z0-9_-]*$
        type:
          type: string
          enum:
            - public-key
        response:
          type: object
          properties:
            clientDataJSON:
              type: string
              pattern: ^[A-Za-z0-9_-]*$
            attestationObject:
              type: string
              pattern: ^[A-Za-z0-9_-]*$
            transports:
              type: array
              items:
                type: string
                example: internal
          required:
            - clientDataJSON
            - attestationObject
          additionalProperties: {}
        authenticatorAttachment:
          type: string
          enum:
            - platform
            - cross-platform
        clientExtensionResults:
          type: object
          properties: {}
          default: {}
          additionalProperties: {}
      required:
        - id
        - rawId
        - type
        - response
    LoginStart:
      type: object
      properties:
        challengeId:
          type: string
          format: uuid
          description: Kennung der Anfrage aus …/options
        options:
          $ref: "#/components/schemas/AuthenticationOptions"
      required:
        - challengeId
        - options
    AuthenticationOptions:
      type: object
      properties:
        challenge:
          type: string
          pattern: ^[A-Za-z0-9_-]*$
        rpId:
          type: string
        timeout:
          type: integer
        allowCredentials:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                pattern: ^[A-Za-z0-9_-]*$
              type:
                type: string
                example: public-key
              transports:
                type: array
                items:
                  type: string
                  example: internal
            required:
              - id
              - type
        userVerification:
          type: string
      required:
        - challenge
      additionalProperties: {}
    AuthenticationCredential:
      type: object
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]*$
        rawId:
          type: string
          pattern: ^[A-Za-z0-9_-]*$
        type:
          type: string
          enum:
            - public-key
        response:
          type: object
          properties:
            clientDataJSON:
              type: string
              pattern: ^[A-Za-z0-9_-]*$
            authenticatorData:
              type: string
              pattern: ^[A-Za-z0-9_-]*$
            signature:
              type: string
              pattern: ^[A-Za-z0-9_-]*$
            userHandle:
              type: string
              pattern: ^[A-Za-z0-9_-]*$
          required:
            - clientDataJSON
            - authenticatorData
            - signature
          additionalProperties: {}
        authenticatorAttachment:
          type: string
          enum:
            - platform
            - cross-platform
        clientExtensionResults:
          type: object
          properties: {}
          default: {}
          additionalProperties: {}
      required:
        - id
        - rawId
        - type
        - response
    Household:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - privat
            - gemeinsam
        name:
          type: string
        members:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              displayName:
                type: string
            required:
              - id
              - displayName
      required:
        - id
        - kind
        - name
        - members
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        householdId:
          type: string
          format: uuid
        name:
          type: string
        source:
          type: string
          enum:
            - bank
            - bar
            - manuell
          description: bank = importiert, bar = Bargeld (wird erfasst), manuell = Import per Datei/App
        iban:
          type:
            - string
            - "null"
        currency:
          type: string
          enum:
            - EUR
        createdAt:
          type: string
          format: date-time
        lastImportAt:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - householdId
        - name
        - source
        - iban
        - currency
        - createdAt
        - lastImportAt
    ImportResult:
      type: object
      properties:
        importId:
          type: string
          format: uuid
        received:
          type: integer
        imported:
          type: integer
          description: neu übernommen
        skipped:
          type: integer
          description: schon bekannt (idempotent)
        recurring:
          type: object
          properties:
            active:
              type: integer
            ended:
              type: integer
          required:
            - active
            - ended
      required:
        - importId
        - received
        - imported
        - skipped
        - recurring
    IncomingTransaction:
      type: object
      properties:
        sourceId:
          type: string
          minLength: 1
          maxLength: 200
          description: Quell-ID der Bank. Nur angeben, wenn sie bei jedem Abruf gleich bleibt.
        bookingDate:
          type: string
          format: date
          example: 2026-11-03
        valueDate:
          type: string
          format: date
          example: 2026-11-03
        amountCents:
          type: integer
          minimum: -100000000000
          maximum: 100000000000
          description: Betrag in Cent; negativ = Ausgang
          example: -1299
        currency:
          type: string
          enum:
            - EUR
          default: EUR
        counterpartyName:
          type: string
          maxLength: 300
        counterpartyIban:
          type: string
          example: DE02120300000000202051
        purpose:
          type: string
          maxLength: 2000
      required:
        - bookingDate
        - amountCents
    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        sourceId:
          type:
            - string
            - "null"
        bookingDate:
          type: string
          format: date
          example: 2026-11-03
        valueDate:
          type:
            - string
            - "null"
          format: date
          example: 2026-11-03
        amountCents:
          type: integer
        currency:
          type: string
          enum:
            - EUR
        counterpartyName:
          type:
            - string
            - "null"
        counterpartyIban:
          type:
            - string
            - "null"
        purpose:
          type:
            - string
            - "null"
        status:
          type: string
          enum:
            - importiert
            - vorgeschlagen
            - bestaetigt
        recurringSeriesId:
          type:
            - string
            - "null"
          format: uuid
      required:
        - id
        - accountId
        - sourceId
        - bookingDate
        - valueDate
        - amountCents
        - currency
        - counterpartyName
        - counterpartyIban
        - purpose
        - status
        - recurringSeriesId
    RecurringSeries:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        counterparty:
          type: string
        direction:
          type: string
          enum:
            - eingang
            - ausgang
        cadence:
          type: string
          enum:
            - woechentlich
            - zweiwoechentlich
            - monatlich
            - quartalsweise
            - halbjaehrlich
            - jaehrlich
        typicalAmountCents:
          type: integer
          description: Median der Beträge
        minAmountCents:
          type: integer
        maxAmountCents:
          type: integer
        occurrences:
          type: integer
        firstDate:
          type: string
          format: date
          example: 2026-11-03
        lastDate:
          type: string
          format: date
          example: 2026-11-03
        nextExpectedDate:
          type: string
          format: date
          example: 2026-11-03
        state:
          type: string
          enum:
            - aktiv
            - beendet
          description: beendet = nächste Buchung deutlich überfällig (z. B. gekündigtes Abo)
      required:
        - id
        - accountId
        - counterparty
        - direction
        - cadence
        - typicalAmountCents
        - minAmountCents
        - maxAmountCents
        - occurrences
        - firstDate
        - lastDate
        - nextExpectedDate
        - state
  parameters: {}
paths:
  /health:
    get:
      tags:
        - Betrieb
      summary: Zustand des Dienstes und der Datenbank
      responses:
        "200":
          description: Dienst und Datenbank erreichbar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Datenbank nicht erreichbar
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - fehler
                  database:
                    type: string
                    enum:
                      - fehler
                required:
                  - status
                  - database
  /v1/auth/registration/options:
    post:
      tags:
        - Anmeldung
      summary: Passkey-Registrierung mit einer Einladung beginnen
      requestBody:
        description: Einladung
        content:
          application/json:
            schema:
              type: object
              properties:
                invitationToken:
                  type: string
                  minLength: 10
                  maxLength: 200
                  description: Einmaliges Einladungs-Token (fre_…), erzeugt per Kommandozeile
              required:
                - invitationToken
      responses:
        "200":
          description: Optionen für navigator.credentials.create() bzw. ASAuthorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationStart"
        "400":
          description: Ungültige Anfrage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Einladung ungültig, abgelaufen oder verbraucht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/auth/registration/verify:
    post:
      tags:
        - Anmeldung
      summary: Passkey-Registrierung abschließen und anmelden
      requestBody:
        description: Antwort des Authenticators
        content:
          application/json:
            schema:
              type: object
              properties:
                challengeId:
                  type: string
                  format: uuid
                  description: Kennung der Anfrage aus …/options
                invitationToken:
                  type: string
                  minLength: 10
                  maxLength: 200
                  description: Einmaliges Einladungs-Token (fre_…), erzeugt per Kommandozeile
                credential:
                  $ref: "#/components/schemas/RegistrationCredential"
              required:
                - challengeId
                - invitationToken
                - credential
      responses:
        "201":
          description: Passkey gespeichert, Sitzung erstellt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Ungültige Anfrage oder abgelaufene Challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Passkey abgelehnt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Passkey bereits registriert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Einladung ungültig, abgelaufen oder verbraucht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/auth/login/options:
    post:
      tags:
        - Anmeldung
      summary: Anmeldung mit Passkey beginnen
      responses:
        "200":
          description: Optionen für navigator.credentials.get() bzw. ASAuthorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginStart"
  /v1/auth/login/verify:
    post:
      tags:
        - Anmeldung
      summary: Anmeldung mit Passkey abschließen
      requestBody:
        description: Antwort des Authenticators
        content:
          application/json:
            schema:
              type: object
              properties:
                challengeId:
                  type: string
                  format: uuid
                  description: Kennung der Anfrage aus …/options
                credential:
                  $ref: "#/components/schemas/AuthenticationCredential"
              required:
                - challengeId
                - credential
      responses:
        "200":
          description: Sitzung erstellt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Ungültige Anfrage oder abgelaufene Challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Passkey abgelehnt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/auth/logout:
    post:
      tags:
        - Anmeldung
      summary: Aktuelle Sitzung beenden
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Abgemeldet
        "401":
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/me:
    get:
      tags:
        - Person
      summary: Angemeldete Person
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Angemeldete Person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "401":
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/households:
    get:
      tags:
        - Haushalte
      summary: Haushalte, in denen die angemeldete Person Mitglied ist
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Haushalte
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Household"
                required:
                  - items
        "401":
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/accounts:
    post:
      tags:
        - Konten
      summary: Konto in einem eigenen Haushalt anlegen
      security:
        - bearerAuth: []
      requestBody:
        description: Neues Konto
        content:
          application/json:
            schema:
              type: object
              properties:
                householdId:
                  type: string
                  format: uuid
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                source:
                  type: string
                  enum:
                    - bank
                    - bar
                    - manuell
                  description: bank = importiert, bar = Bargeld (wird erfasst), manuell = Import per Datei/App
                iban:
                  type: string
                  example: DE02120300000000202051
              required:
                - householdId
                - name
                - source
      responses:
        "201":
          description: Konto angelegt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          description: Ungültige Anfrage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Haushalt nicht gefunden (oder kein Zugriff)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Fachlich unzulässig
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags:
        - Konten
      summary: Konten aller eigenen Haushalte
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Konten
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Account"
                required:
                  - items
        "401":
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/accounts/{accountId}/imports:
    post:
      tags:
        - Konten
      summary: Buchungen idempotent importieren
      description: "Bekannte Buchungen werden übersprungen: Schlüssel ist die Quell-ID, sonst ein Hash aus Konto, Buchungstag, Betrag, Verwendungszweck und Gegenpartei (plus Vorkommen bei gleichen Buchungen am selben Tag). Ein Abruf sollte deshalb immer ganze Tage abdecken. Danach werden die wiederkehrenden Serien des Kontos neu berechnet."
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: accountId
          in: path
      requestBody:
        description: Gebuchte Umsätze (keine vorgemerkten)
        content:
          application/json:
            schema:
              type: object
              properties:
                transactions:
                  type: array
                  items:
                    $ref: "#/components/schemas/IncomingTransaction"
                  maxItems: 10000
              required:
                - transactions
      responses:
        "201":
          description: Import abgeschlossen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: Ungültige Anfrage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Konto nicht gefunden (oder kein Zugriff)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Fachlich unzulässig, z. B. Bargeldkonto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/accounts/{accountId}/transactions:
    get:
      tags:
        - Konten
      summary: Buchungen eines Kontos, neueste zuerst
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: accountId
          in: path
        - schema:
            type: string
            format: date
            example: 2026-11-03
          required: false
          name: from
          in: query
        - schema:
            type: string
            format: date
            example: 2026-11-03
          required: false
          name: to
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: Buchungen
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transaction"
                required:
                  - items
        "400":
          description: Ungültige Anfrage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Konto nicht gefunden (oder kein Zugriff)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/recurring:
    get:
      tags:
        - Wiederkehrend
      summary: Erkannte wiederkehrende Buchungen (Abos, Miete, Gehalt)
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            enum:
              - aktiv
              - beendet
          required: false
          name: state
          in: query
        - schema:
            type: string
            format: uuid
          required: false
          name: accountId
          in: query
      responses:
        "200":
          description: Serien
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecurringSeries"
                required:
                  - items
        "400":
          description: Ungültige Anfrage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
webhooks: {}
