                $ref: "#/components/schemas/Error"
  /v1/transactions/{transactionId}/splits:
    put:
      tags:
        - Kategorisierung
      summary: Aufteilung festlegen (korrigieren) und bestätigen
      description: Die Summe der Aufteilungen muss dem Buchungsbetrag entsprechen; Töpfe kommen aus dem Haushalt des Kontos. Weicht eine einfache Zuordnung vom Vorschlag ab, entsteht eine Regel für die Gegenpartei (außer learn = false), und offene Buchungen werden neu vorgeschlagen.
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: transactionId
          in: path
      requestBody:
        description: Aufteilung
        content:
          application/json:
            schema:
              type: object
              properties:
                splits:
                  type: array
                  items:
                    $ref: "#/components/schemas/Split"
                  minItems: 1
                  maxItems: 50
                learn:
                  type: boolean
                  default: true
              required:
                - splits
      responses:
        "200":
          description: Bestätigte Buchung
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction:
                    $ref: "#/components/schemas/Transaction"
                  rule:
                    $ref: "#/components/schemas/Rule"
                  resuggested:
                    type: integer
                    description: offene Buchungen, die die Regel neu vorgeschlagen hat
                required:
                  - transaction
                  - rule
                  - resuggested
        "400":
          description: Ungültige Anfrage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Buchung nicht gefunden (oder kein Zugriff)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Summe falsch oder Topf aus anderem Haushalt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/accounts/{accountId}/cash-expenses:
    post:
      tags:
        - Konten
      summary: Barausgabe erfassen
      description: "Legt im Bargeldkonto eine bestätigte Ausgabe an, gleich einem Topf aus dem Haushalt des Kontos zugeordnet. Idempotent über clientId: Ein zweiter Aufruf mit derselben clientId legt nichts an und liefert die vorhandene Buchung (200). Es entsteht keine Regel."
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: accountId
          in: path
      requestBody:
        description: Barausgabe
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId:
                  type: string
                  format: uuid
                  description: Von der App je Eingabe einmal erzeugt, schützt vor doppelten Buchungen
                bookingDate:
                  type: string
                  format: date
                  example: 2026-11-03
                amountCents:
                  type: integer
                  minimum: 1
                  maximum: 100000000
                  description: Ausgegebener Betrag in Cent, positiv (wird als Ausgang gebucht)
                  example: 450
                description:
                  type: string
                  maxLength: 300
                  description: Wofür oder wo, z. B. „Bäcker“
                potId:
                  type: string
                  format: uuid
              required:
                - clientId
                - bookingDate
                - amountCents
                - potId
      responses:
        "200":
          description: Schon erfasst (gleiche clientId)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "201":
          description: Barausgabe erfasst
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          description: Ungültige Anfrage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Konto nicht gefunden (oder kein Zugriff)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Kein Bargeldkonto, Topf aus anderem Haushalt oder archiviert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/households/{householdId}/rules:
    get:
      tags:
        - Kategorisierung
      summary: Kategorisierungsregeln eines Haushalts
      security:
