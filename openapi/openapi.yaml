  /v1/households/{householdId}/budget/{month}/pots/{potId}:
    put:
      tags:
        - Budget
      summary: Zuweisung eines Topfs für einen Monat setzen
      description: Erhöhen geht nur, solange „Noch ohne Aufgabe“ im Monat (und im laufenden Monat, falls später) nicht negativ wird. Senken geht immer. Eine eigene Zuweisung an einen Erst-ich-Topf schaltet die Automatik für diesen Topf und Monat ab.
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: householdId
          in: path
        - schema:
            type: string
            pattern: ^\d{4}-(0[1-9]|1[0-2])$
            example: 2026-11
          required: true
          name: month
          in: path
        - schema:
            type: string
            format: uuid
          required: true
          name: potId
          in: path
      requestBody:
        description: Neuer Betrag (nicht die Änderung)
        content:
          application/json:
            schema:
              type: object
              properties:
                assignedCents:
                  type: integer
                  minimum: -100000000000
                  maximum: 100000000000
                  description: Betrag in Cent; negativ = Ausgang
                  example: -1299
              required:
                - assignedCents
      responses:
        "200":
          description: Budget des Monats nach der Änderung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetMonth"
        "400":
          description: Ungültige Anfrage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Haushalt oder Topf nicht gefunden (oder kein Zugriff)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Monat abgeschlossen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Nicht genug Geld ohne Aufgabe, oder Topf archiviert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
