      description: "Legt im Bargeldkonto eine bestätigte Ausgabe an, gleich einem Topf aus dem Haushalt des Kontos zugeordnet. Idempotent über clientId: Ein zweiter Aufruf mit derselben clientId legt nichts an und liefert die vorhandene Buchung (200). Es entsteht keine Regel."
