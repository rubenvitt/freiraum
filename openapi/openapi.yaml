  /v1/households/{householdId}/pots:
    get:
      tags:
        - Budget
      summary: Töpfe eines Haushalts
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: householdId
          in: path
        - schema:
            type: string
            enum:
              - "true"
              - "false"
            default: "false"
          required: false
          name: includeArchived
          in: query
      responses:
        "200":
          description: Töpfe
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Pot"
                required:
                  - items
        "400":
          description: Ungültige Anfrage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Haushalt nicht gefunden (oder kein Zugriff)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - Budget
      summary: Topf anlegen
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: householdId
          in: path
      requestBody:
        description: Neuer Topf
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                kind:
                  type: string
                  enum:
                    - monatlich
                    - ruecklage
                    - ziel
                    - erst_ich
                  description: monatlich = Monatsbudget (amountCents je Monat, optional); ruecklage = unregelmäßige Kosten (amountCents je Jahr, Monatsrate = ein Zwölftel); ziel = Zielbetrag (amountCents) bis targetMonth; erst_ich = wird nach jeder Einnahme zuerst gefüllt (amountCents je Monat oder percentBp der Einnahmen des Monats)
                groupName:
                  type:
                    - string
                    - "null"
                  maxLength: 100
                amountCents:
                  type:
                    - integer
                    - "null"
                  minimum: 1
                  maximum: 100000000000
                percentBp:
                  type:
                    - integer
                    - "null"
                  minimum: 1
                  maximum: 10000
                  description: Anteil in Basispunkten, 1000 = 10 %
                  example: 1000
                targetMonth:
                  type:
                    - string
                    - "null"
                  pattern: ^\d{4}-(0[1-9]|1[0-2])$
                  example: 2026-11
                sortOrder:
                  type: integer
                  minimum: 0
                  maximum: 100000
              required:
                - name
                - kind
      responses:
        "201":
          description: Topf angelegt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pot"
        "400":
          description: Ungültige Anfrage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Haushalt nicht gefunden (oder kein Zugriff)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Name schon vergeben
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Plan passt nicht zum Topf-Typ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
