# Erzeugt von backend/src/openapi-export.ts – nicht von Hand ändern.
openapi: 3.1.0
info:
  title: Freiraum API
  version: 0.1.0
  description: Backend von Freiraum. Beträge immer als ganze Cent (Integer). Anmeldung nur per Passkey nach Einladung.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Sitzungs-Token aus /v1/auth/…/verify
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
        database:
          type: string
          enum:
            - ok
      required:
        - status
        - database
    RegistrationStart:
      type: object
      properties:
        challengeId:
          type: string
          format: uuid
          description: Kennung der Anfrage aus …/options
        options:
          $ref: "#/components/schemas/RegistrationOptions"
      required:
        - challengeId
        - options
    RegistrationOptions:
      type: object
      properties:
        challenge:
          type: string
          pattern: ^[A-Za-z0-9_-]*$
        rp:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
          required:
            - name
        user:
          type: object
          properties:
            id:
              type: string
              pattern: ^[A-Za-z0-9_-]*$
            name:
              type: string
            displayName:
              type: string
          required:
            - id
            - name
            - displayName
        pubKeyCredParams:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                example: public-key
              alg:
                type: integer
            required:
              - type
              - alg
        timeout:
          type: integer
        excludeCredentials:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                pattern: ^[A-Za-z0-9_-]*$
              type:
                type: string
                example: public-key
              transports:
                type: array
                items:
                  type: string
                  example: internal
            required:
              - id
              - type
        authenticatorSelection:
          type: object
          properties:
            residentKey:
              type: string
            userVerification:
              type: string
          additionalProperties: {}
        attestation:
          type: string
      required:
        - challenge
        - rp
        - user
        - pubKeyCredParams
      additionalProperties: {}
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: nicht_angemeldet
            message:
              type: string
              example: Bitte melde dich an.
          required:
            - code
            - message
      required:
        - error
    Session:
      type: object
      properties:
        token:
          type: string
          description: Bearer-Token für den Header Authorization
        expiresAt:
          type: string
          format: date-time
        person:
          $ref: "#/components/schemas/Person"
      required:
        - token
        - expiresAt
        - person
    Person:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          example: Person A
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - displayName
        - createdAt
    RegistrationCredential:
      type: object
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]*$
        rawId:
          type: string
          pattern: ^[A-Za-z0-9_-]*$
        type:
          type: string
          enum:
            - public-key
        response:
          type: object
          properties:
            clientDataJSON:
              type: string
              pattern: ^[A-Za-z0-9_-]*$
            attestationObject:
              type: string
              pattern: ^[A-Za-z0-9_-]*$
            transports:
              type: array
              items:
                type: string
                example: internal
          required:
            - clientDataJSON
            - attestationObject
          additionalProperties: {}
        authenticatorAttachment:
          type: string
          enum:
            - platform
            - cross-platform
        clientExtensionResults:
          type: object
          properties: {}
          default: {}
          additionalProperties: {}
      required:
        - id
        - rawId
        - type
        - response
    LoginStart:
      type: object
      properties:
        challengeId:
          type: string
          format: uuid
          description: Kennung der Anfrage aus …/options
        options:
          $ref: "#/components/schemas/AuthenticationOptions"
      required:
        - challengeId
        - options
    AuthenticationOptions:
      type: object
      properties:
        challenge:
          type: string
          pattern: ^[A-Za-z0-9_-]*$
        rpId:
          type: string
        timeout:
          type: integer
        allowCredentials:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                pattern: ^[A-Za-z0-9_-]*$
              type:
                type: string
                example: public-key
              transports:
                type: array
                items:
                  type: string
                  example: internal
            required:
              - id
              - type
        userVerification:
          type: string
      required:
        - challenge
      additionalProperties: {}
    AuthenticationCredential:
      type: object
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]*$
        rawId:
          type: string
          pattern: ^[A-Za-z0-9_-]*$
        type:
          type: string
          enum:
            - public-key
        response:
          type: object
          properties:
            clientDataJSON:
              type: string
              pattern: ^[A-Za-z0-9_-]*$
            authenticatorData:
              type: string
              pattern: ^[A-Za-z0-9_-]*$
            signature:
              type: string
              pattern: ^[A-Za-z0-9_-]*$
            userHandle:
              type: string
              pattern: ^[A-Za-z0-9_-]*$
          required:
            - clientDataJSON
            - authenticatorData
            - signature
          additionalProperties: {}
        authenticatorAttachment:
          type: string
          enum:
            - platform
            - cross-platform
        clientExtensionResults:
          type: object
          properties: {}
          default: {}
          additionalProperties: {}
      required:
        - id
        - rawId
        - type
        - response
  parameters: {}
paths:
  /health:
    get:
      tags:
        - Betrieb
      summary: Zustand des Dienstes und der Datenbank
      responses:
        "200":
          description: Dienst und Datenbank erreichbar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Datenbank nicht erreichbar
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - fehler
                  database:
                    type: string
                    enum:
                      - fehler
                required:
                  - status
                  - database
  /v1/auth/registration/options:
    post:
      tags:
        - Anmeldung
      summary: Passkey-Registrierung mit einer Einladung beginnen
      requestBody:
        description: Einladung
        content:
          application/json:
            schema:
              type: object
              properties:
                invitationToken:
                  type: string
                  minLength: 10
                  maxLength: 200
                  description: Einmaliges Einladungs-Token (fre_…), erzeugt per Kommandozeile
              required:
                - invitationToken
      responses:
        "200":
          description: Optionen für navigator.credentials.create() bzw. ASAuthorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationStart"
        "400":
          description: Ungültige Anfrage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Einladung ungültig, abgelaufen oder verbraucht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/auth/registration/verify:
    post:
      tags:
        - Anmeldung
      summary: Passkey-Registrierung abschließen und anmelden
      requestBody:
        description: Antwort des Authenticators
        content:
          application/json:
            schema:
              type: object
              properties:
                challengeId:
                  type: string
                  format: uuid
                  description: Kennung der Anfrage aus …/options
                invitationToken:
                  type: string
                  minLength: 10
                  maxLength: 200
                  description: Einmaliges Einladungs-Token (fre_…), erzeugt per Kommandozeile
                credential:
                  $ref: "#/components/schemas/RegistrationCredential"
              required:
                - challengeId
                - invitationToken
                - credential
      responses:
        "201":
          description: Passkey gespeichert, Sitzung erstellt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Ungültige Anfrage oder abgelaufene Challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Passkey abgelehnt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Passkey bereits registriert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Einladung ungültig, abgelaufen oder verbraucht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/auth/login/options:
    post:
      tags:
        - Anmeldung
      summary: Anmeldung mit Passkey beginnen
      responses:
        "200":
          description: Optionen für navigator.credentials.get() bzw. ASAuthorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginStart"
  /v1/auth/login/verify:
    post:
      tags:
        - Anmeldung
      summary: Anmeldung mit Passkey abschließen
      requestBody:
        description: Antwort des Authenticators
        content:
          application/json:
            schema:
              type: object
              properties:
                challengeId:
                  type: string
                  format: uuid
                  description: Kennung der Anfrage aus …/options
                credential:
                  $ref: "#/components/schemas/AuthenticationCredential"
              required:
                - challengeId
                - credential
      responses:
        "200":
          description: Sitzung erstellt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Ungültige Anfrage oder abgelaufene Challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Passkey abgelehnt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/auth/logout:
    post:
      tags:
        - Anmeldung
      summary: Aktuelle Sitzung beenden
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Abgemeldet
        "401":
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/me:
    get:
      tags:
        - Person
      summary: Angemeldete Person
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Angemeldete Person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "401":
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
webhooks: {}
