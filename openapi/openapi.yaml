        content:
          application/json:
            schema:
              type: object
              properties:
                clientId:
                  type: string
                  format: uuid
                  description: Von der App je Eingabe einmal erzeugt, schützt vor doppelten Buchungen
                bookingDate:
                  type: string
                  format: date
                  example: 2026-11-03
                amountCents:
                  type: integer
                  minimum: 1
                  maximum: 100000000
                  description: Ausgegebener Betrag in Cent, positiv (wird als Ausgang gebucht)
                  example: 450
                description:
                  type: string
                  maxLength: 300
                  description: Wofür oder wo, z. B. „Bäcker“
