            - ausgaben_hoch
            - neues_abo
            - preis_erhoeht
        title:
          type: string
          description: ein Satz für die Anzeige
        potId:
          type:
            - string
            - "null"
          format: uuid
        seriesId:
          type:
            - string
            - "null"
          format: uuid
        amountCents:
          type: integer
        referenceCents:
          type:
            - integer
            - "null"
      required:
        - kind
        - title
        - potId
        - seriesId
        - amountCents
        - referenceCents
    Goals:
      type: object
      properties:
        householdId:
          type: string
          format: uuid
        month:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          example: 2026-11
        items:
          type: array
          items:
            $ref: "#/components/schemas/GoalForecast"
      required:
        - householdId
        - month
        - items
    GoalForecast:
      type: object
      properties:
        potId:
          type: string
          format: uuid
        name:
          type: string
        targetCents:
          type: integer
        savedCents:
          type: integer
          description: Verfügbar im Topf, ≥ 0
        remainingCents:
          type: integer
        progressBp:
          type: integer
        targetMonth:
          type:
            - string
            - "null"
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          example: 2026-11
        monthlyRateCents:
          type: integer
          description: Durchschnittliche Zuweisung der letzten 3 Monate (mit dem laufenden)
        projectedMonth:
          type:
            - string
            - "null"
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          example: 2026-11
          description: Monat, in dem das Ziel bei dieser Rate erreicht ist
        requiredMonthlyCents:
          type:
            - integer
            - "null"
          description: Monatlich nötig ab dem nächsten Monat, um den Zielmonat zu halten
        status:
          type: string
          enum:
            - erreicht
            - im_plan
            - verspaetet
            - ohne_sparrate
      required:
        - potId
        - name
        - targetCents
        - savedCents
        - remainingCents
        - progressBp
        - targetMonth
        - monthlyRateCents
        - projectedMonth
        - requiredMonthlyCents
        - status
    OwnershipCosts:
      type: object
      properties:
        householdId:
          type: string
          format: uuid
        from:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          example: 2026-11
        to:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          example: 2026-11
        items:
          type: array
          items:
            $ref: "#/components/schemas/AssetCosts"
        totalCostCents:
          type: integer
        shareOfConsumptionBp:
          type:
            - integer
            - "null"
          description: Anteil der Besitzkosten am Konsum
      required:
        - householdId
        - from
        - to
        - items
        - totalCostCents
        - shareOfConsumptionBp
    AssetCosts:
      type: object
      properties:
        assetId:
          type: string
          format: uuid
        name:
          type: string
        valueCents:
          type:
            - integer
            - "null"
        costCents:
          type: integer
          description: Nettokosten im Zeitraum aus den Töpfen (positiv = kostet)
        recurringCostCents:
          type: integer
          description: davon wiederkehrend
        monthlyAverageCents:
          type: integer
        annualCostOfValueBp:
          type:
            - integer
            - "null"
          description: Jahreskosten im Verhältnis zum Wert, in Basispunkten
        classification:
          type: string
          enum:
            - verbindlichkeit
            - vermoegenswert
            - neutral
          description: "Vermögenswert ohne Gewinn = Verbindlichkeit: kostet mehr, als er einbringt"
        pots:
          type: array
          items:
            type: object
            properties:
              potId:
                type: string
                format: uuid
              name:
                type: string
              costCents:
                type: integer
            required:
              - potId
              - name
              - costCents
      required:
        - assetId
        - name
        - valueCents
        - costCents
        - recurringCostCents
        - monthlyAverageCents
        - annualCostOfValueBp
        - classification
        - pots
    Asset:
      type: object
      properties:
        id:
          type: string
          format: uuid
        householdId:
          type: string
          format: uuid
        name:
          type: string
        valueCents:
          type:
            - integer
            - "null"
          description: aktueller Wert, von Hand
        sortOrder:
          type: integer
        potIds:
          type: array
          items:
            type: string
            format: uuid
          description: Töpfe mit den laufenden Kosten
        archived:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - householdId
        - name
        - valueCents
        - sortOrder
        - potIds
        - archived
        - createdAt
  parameters: {}
paths:
  /health:
    get:
      tags:
        - Betrieb
      summary: Zustand des Dienstes und der Datenbank
      responses:
        "200":
          description: Dienst und Datenbank erreichbar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Datenbank nicht erreichbar
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - fehler
                  database:
                    type: string
                    enum:
                      - fehler
                required:
                  - status
                  - database
  /v1/auth/registration/options:
    post:
      tags:
        - Anmeldung
      summary: Passkey-Registrierung mit einer Einladung beginnen
      requestBody:
        description: Einladung
        content:
          application/json:
            schema:
              type: object
              properties:
                invitationToken:
                  type: string
                  minLength: 10
                  maxLength: 200
                  description: Einmaliges Einladungs-Token (fre_…), erzeugt per Kommandozeile
              required:
                - invitationToken
      responses:
        "200":
          description: Optionen für navigator.credentials.create() bzw. ASAuthorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationStart"
        "400":
          description: Ungültige Anfrage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Einladung ungültig, abgelaufen oder verbraucht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/auth/registration/verify:
    post:
      tags:
        - Anmeldung
      summary: Passkey-Registrierung abschließen und anmelden
      requestBody:
        description: Antwort des Authenticators
        content:
          application/json:
            schema:
              type: object
              properties:
                challengeId:
                  type: string
                  format: uuid
                  description: Kennung der Anfrage aus …/options
                invitationToken:
                  type: string
                  minLength: 10
                  maxLength: 200
                  description: Einmaliges Einladungs-Token (fre_…), erzeugt per Kommandozeile
                credential:
                  $ref: "#/components/schemas/RegistrationCredential"
              required:
                - challengeId
                - invitationToken
                - credential
      responses:
        "201":
          description: Passkey gespeichert, Sitzung erstellt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Ungültige Anfrage oder abgelaufene Challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Passkey abgelehnt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Passkey bereits registriert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Einladung ungültig, abgelaufen oder verbraucht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/auth/login/options:
    post:
      tags:
        - Anmeldung
      summary: Anmeldung mit Passkey beginnen
      responses:
        "200":
          description: Optionen für navigator.credentials.get() bzw. ASAuthorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginStart"
  /v1/auth/login/verify:
    post:
      tags:
        - Anmeldung
      summary: Anmeldung mit Passkey abschließen
      requestBody:
        description: Antwort des Authenticators
        content:
          application/json:
            schema:
              type: object
              properties:
                challengeId:
                  type: string
                  format: uuid
                  description: Kennung der Anfrage aus …/options
                credential:
                  $ref: "#/components/schemas/AuthenticationCredential"
              required:
                - challengeId
                - credential
      responses:
        "200":
          description: Sitzung erstellt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Ungültige Anfrage oder abgelaufene Challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Passkey abgelehnt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/auth/logout:
    post:
      tags:
        - Anmeldung
      summary: Aktuelle Sitzung beenden
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Abgemeldet
        "401":
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/me:
    get:
      tags:
        - Person
      summary: Angemeldete Person
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Angemeldete Person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "401":
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/households:
    get:
      tags:
        - Haushalte
      summary: Haushalte, in denen die angemeldete Person Mitglied ist
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Haushalte
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Household"
                required:
                  - items
        "401":
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/accounts:
    post:
      tags:
        - Konten
      summary: Konto in einem eigenen Haushalt anlegen
      security:
        - bearerAuth: []
      requestBody:
        description: Neues Konto
        content:
          application/json:
            schema:
              type: object
              properties:
                householdId:
                  type: string
                  format: uuid
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                source:
                  type: string
                  enum:
                    - bank
                    - bar
                    - manuell
                  description: bank = importiert, bar = Bargeld (wird erfasst), manuell = Import per Datei/App
                iban:
                  type: string
                  example: DE02120300000000202051
              required:
                - householdId
                - name
                - source
      responses:
        "201":
          description: Konto angelegt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          description: Ungültige Anfrage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Haushalt nicht gefunden (oder kein Zugriff)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Fachlich unzulässig
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags:
        - Konten
      summary: Konten aller eigenen Haushalte
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Konten
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Account"
                required:
                  - items
        "401":
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/accounts/{accountId}/imports:
    post:
      tags:
        - Konten
      summary: Buchungen idempotent importieren
      description: "Bekannte Buchungen werden übersprungen: Schlüssel ist die Quell-ID, sonst ein Hash aus Konto, Buchungstag, Betrag, Verwendungszweck und Gegenpartei (plus Vorkommen bei gleichen Buchungen am selben Tag). Ein Abruf sollte deshalb immer ganze Tage abdecken. Danach werden die wiederkehrenden Serien des Kontos neu berechnet."
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: accountId
          in: path
      requestBody:
        description: Gebuchte Umsätze (keine vorgemerkten)
        content:
          application/json:
            schema:
              type: object
              properties:
                transactions:
                  type: array
                  items:
                    $ref: "#/components/schemas/IncomingTransaction"
                  maxItems: 10000
              required:
                - transactions
      responses:
        "201":
          description: Import abgeschlossen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: Ungültige Anfrage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Konto nicht gefunden (oder kein Zugriff)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Fachlich unzulässig, z. B. Bargeldkonto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/accounts/{accountId}/transactions:
    get:
      tags:
        - Konten
      summary: Buchungen eines Kontos, neueste zuerst
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: accountId
          in: path
        - schema:
            type: string
            format: date
            example: 2026-11-03
          required: false
          name: from
          in: query
        - schema:
            type: string
            format: date
            example: 2026-11-03
          required: false
          name: to
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: Buchungen
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transaction"
                required:
                  - items
        "400":
          description: Ungültige Anfrage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Konto nicht gefunden (oder kein Zugriff)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/recurring:
    get:
      tags:
        - Wiederkehrend
      summary: Erkannte wiederkehrende Buchungen (Abos, Miete, Gehalt)
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            enum:
              - aktiv
              - beendet
          required: false
          name: state
          in: query
        - schema:
            type: string
            format: uuid
          required: false
          name: accountId
          in: query
      responses:
        "200":
          description: Serien
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecurringSeries"
                required:
                  - items
        "400":
          description: Ungültige Anfrage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/households/{householdId}/pots:
    get:
      tags:
        - Budget
      summary: Töpfe eines Haushalts
      description: Lesen auch mit der Freigabe „budget“ der Inhaberin eines privaten Haushalts.
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: householdId
          in: path
        - schema:
            type: string
            enum:
              - "true"
              - "false"
            default: "false"
          required: false
          name: includeArchived
          in: query
      responses:
        "200":
          description: Töpfe
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Pot"
                required:
                  - items
        "400":
          description: Ungültige Anfrage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Haushalt nicht gefunden (oder kein Zugriff)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - Budget
      summary: Topf anlegen
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: householdId
          in: path
      requestBody:
        description: Neuer Topf
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                kind:
                  type: string
                  enum:
                    - monatlich
                    - ruecklage
                    - ziel
                    - erst_ich
                  description: monatlich = Monatsbudget (amountCents je Monat, optional); ruecklage = unregelmäßige Kosten (amountCents je Jahr, Monatsrate = ein Zwölftel); ziel = Zielbetrag (amountCents) bis targetMonth; erst_ich = wird nach jeder Einnahme zuerst gefüllt (amountCents je Monat oder percentBp der Einnahmen des Monats)
                groupName:
                  type:
                    - string
                    - "null"
                  maxLength: 100
                amountCents:
                  type:
                    - integer
                    - "null"
                  minimum: 1
                  maximum: 100000000000
                percentBp:
                  type:
                    - integer
                    - "null"
                  minimum: 1
                  maximum: 10000
                  description: Anteil in Basispunkten, 1000 = 10 %
                  example: 1000
                targetMonth:
                  type:
                    - string
                    - "null"
                  pattern: ^\d{4}-(0[1-9]|1[0-2])$
                  example: 2026-11
                sortOrder:
                  type: integer
                  minimum: 0
                  maximum: 100000
              required:
                - name
                - kind
      responses:
        "201":
          description: Topf angelegt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pot"
        "400":
          description: Ungültige Anfrage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Haushalt nicht gefunden (oder kein Zugriff)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Name schon vergeben
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Plan passt nicht zum Topf-Typ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/pots/{potId}:
    patch:
      tags:
        - Budget
      summary: Topf ändern oder archivieren
      description: Der Typ lässt sich nicht ändern. Archivieren geht nur, wenn der Topf leer ist.
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: potId
          in: path
      requestBody:
        description: Änderungen
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                groupName:
                  type:
                    - string
                    - "null"
                  maxLength: 100
                amountCents:
                  type:
                    - integer
                    - "null"
                  minimum: 1
                  maximum: 100000000000
                percentBp:
                  type:
                    - integer
                    - "null"
                  minimum: 1
                  maximum: 10000
                  description: Anteil in Basispunkten, 1000 = 10 %
                  example: 1000
                targetMonth:
                  type:
                    - string
                    - "null"
                  pattern: ^\d{4}-(0[1-9]|1[0-2])$
                  example: 2026-11
                sortOrder:
                  type: integer
                  minimum: 0
                  maximum: 100000
                archived:
                  type: boolean
                clear:
                  type: array
                  items:
                    type: string
                    enum:
                      - groupName
                      - amountCents
                      - percentBp
                      - targetMonth
                  maxItems: 4
                  description: Felder, die geleert werden (wie `null`). Für Clients, die `null` nicht senden können. Ein Feld darf nicht zugleich einen Wert bekommen.
                  example:
                    - amountCents
      responses:
        "200":
          description: Topf geändert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pot"
        "400":
          description: Ungültige Anfrage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Topf nicht gefunden (oder kein Zugriff)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Name vergeben oder Topf nicht leer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Plan passt nicht zum Topf-Typ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/households/{householdId}/pot-order:
    put:
      tags:
        - Budget
      summary: Töpfe sortieren
      description: Legt die Reihenfolge aller aktiven Töpfe eines Haushalts in einem Schritt fest (sortOrder = Position). Die Liste muss genau die aktiven Töpfe enthalten. Erst-ich-Töpfe werden in dieser Reihenfolge gefüllt; die Automatik läuft danach für den laufenden Monat neu.
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: householdId
          in: path
      requestBody:
