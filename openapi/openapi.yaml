      requestBody:
        description: Neue Regel
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInput"
      responses:
        "201":
          description: Regel angelegt (oder bestehende umgelenkt)
          content:
            application/json:
              schema:
                type: object
                properties:
                  rule:
                    $ref: "#/components/schemas/Rule"
                  resuggested:
                    type: integer
                required:
