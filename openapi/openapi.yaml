# Erzeugt von backend/src/openapi-export.ts – nicht von Hand ändern.
openapi: 3.1.0
info:
  title: Freiraum API
  version: 0.1.0
  description: Backend von Freiraum. Beträge immer als ganze Cent (Integer). Anmeldung nur per Passkey nach Einladung.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Sitzungs-Token aus /v1/auth/…/verify
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
        database:
          type: string
          enum:
            - ok
      required:
        - status
        - database
    RegistrationStart:
      type: object
      properties:
        challengeId:
          type: string
          format: uuid
          description: Kennung der Anfrage aus …/options
        options:
          $ref: "#/components/schemas/RegistrationOptions"
      required:
        - challengeId
        - options
    RegistrationOptions:
      type: object
      properties:
        challenge:
          type: string
          pattern: ^[A-Za-z0-9_-]*$
        rp:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
          required:
            - name
        user:
          type: object
          properties:
            id:
              type: string
              pattern: ^[A-Za-z0-9_-]*$
            name:
              type: string
            displayName:
              type: string
          required:
            - id
            - name
            - displayName
        pubKeyCredParams:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                example: public-key
              alg:
                type: integer
            required:
              - type
              - alg
        timeout:
          type: integer
        excludeCredentials:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                pattern: ^[A-Za-z0-9_-]*$
              type:
                type: string
                example: public-key
              transports:
                type: array
                items:
                  type: string
                  example: internal
            required:
              - id
              - type
        authenticatorSelection:
          type: object
          properties:
            residentKey:
              type: string
            userVerification:
              type: string
          additionalProperties: {}
        attestation:
          type: string
      required:
        - challenge
        - rp
        - user
        - pubKeyCredParams
      additionalProperties: {}
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: nicht_angemeldet
            message:
              type: string
              example: Bitte melde dich an.
          required:
            - code
            - message
      required:
        - error
    Session:
      type: object
      properties:
        token:
          type: string
          description: Bearer-Token für den Header Authorization
        expiresAt:
          type: string
          format: date-time
        person:
          $ref: "#/components/schemas/Person"
      required:
        - token
        - expiresAt
        - person
    Person:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          example: Person A
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - displayName
        - createdAt
    RegistrationCredential:
      type: object
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]*$
        rawId:
          type: string
          pattern: ^[A-Za-z0-9_-]*$
        type:
          type: string
          enum:
            - public-key
        response:
          type: object
          properties:
            clientDataJSON:
              type: string
              pattern: ^[A-Za-z0-9_-]*$
            attestationObject:
              type: string
              pattern: ^[A-Za-z0-9_-]*$
            transports:
              type: array
              items:
                type: string
                example: internal
          required:
            - clientDataJSON
            - attestationObject
          additionalProperties: {}
        authenticatorAttachment:
          type: string
          enum:
            - platform
            - cross-platform
        clientExtensionResults:
          type: object
          properties: {}
          default: {}
          additionalProperties: {}
      required:
        - id
        - rawId
        - type
        - response
    LoginStart:
      type: object
      properties:
        challengeId:
          type: string
          format: uuid
          description: Kennung der Anfrage aus …/options
        options:
          $ref: "#/components/schemas/AuthenticationOptions"
      required:
        - challengeId
        - options
    AuthenticationOptions:
      type: object
      properties:
        challenge:
          type: string
          pattern: ^[A-Za-z0-9_-]*$
        rpId:
          type: string
        timeout:
          type: integer
        allowCredentials:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                pattern: ^[A-Za-z0-9_-]*$
              type:
                type: string
                example: public-key
              transports:
                type: array
                items:
                  type: string
                  example: internal
            required:
              - id
              - type
        userVerification:
          type: string
      required:
        - challenge
      additionalProperties: {}
    AuthenticationCredential:
      type: object
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]*$
        rawId:
          type: string
          pattern: ^[A-Za-z0-9_-]*$
        type:
          type: string
          enum:
            - public-key
        response:
          type: object
          properties:
            clientDataJSON:
              type: string
              pattern: ^[A-Za-z0-9_-]*$
            authenticatorData:
              type: string
              pattern: ^[A-Za-z0-9_-]*$
            signature:
              type: string
              pattern: ^[A-Za-z0-9_-]*$
            userHandle:
              type: string
              pattern: ^[A-Za-z0-9_-]*$
          required:
            - clientDataJSON
            - authenticatorData
            - signature
          additionalProperties: {}
        authenticatorAttachment:
          type: string
          enum:
            - platform
            - cross-platform
        clientExtensionResults:
          type: object
          properties: {}
          default: {}
          additionalProperties: {}
      required:
        - id
        - rawId
        - type
        - response
    Household:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - privat
            - gemeinsam
        name:
          type: string
        members:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              displayName:
                type: string
            required:
              - id
              - displayName
      required:
        - id
        - kind
        - name
        - members
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        householdId:
          type: string
          format: uuid
        name:
          type: string
        source:
          type: string
          enum:
            - bank
            - bar
            - manuell
          description: bank = importiert, bar = Bargeld (wird erfasst), manuell = Import per Datei/App
        iban:
          type:
            - string
            - "null"
        currency:
          type: string
          enum:
            - EUR
        createdAt:
          type: string
          format: date-time
        lastImportAt:
          type:
            - string
            - "null"
          format: date-time
        balance:
          type:
            - object
            - "null"
          properties:
            cents:
              type: integer
            date:
              type: string
              format: date
              example: 2026-11-03
              description: Stand am Ende dieses Tages
            source:
              type: string
              enum:
                - manuell
                - anbieter
          required:
            - cents
            - date
            - source
          description: Bekannter Kontostand, Grundlage des Anfangsbestands im Budget
        unrecordedCashCents:
          type:
            - integer
            - "null"
          description: "nur bei source = bar: abgehobenes Bargeld, für das noch keine Ausgaben erfasst sind (Umbuchungen mit diesem Konto als Gegenkonto plus Buchungen des Kontos). Negativ, wenn mehr erfasst als abgehoben wurde. Sonst null."
      required:
        - id
        - householdId
        - name
        - source
        - iban
        - currency
        - createdAt
        - lastImportAt
        - balance
        - unrecordedCashCents
    ImportResult:
      type: object
      properties:
        importId:
          type: string
          format: uuid
        received:
          type: integer
        imported:
          type: integer
          description: neu übernommen
        skipped:
          type: integer
          description: schon bekannt (idempotent)
        recurring:
          type: object
          properties:
            active:
              type: integer
            ended:
              type: integer
          required:
            - active
            - ended
      required:
        - importId
        - received
        - imported
        - skipped
        - recurring
    IncomingTransaction:
      type: object
      properties:
        sourceId:
          type: string
          minLength: 1
          maxLength: 200
          description: Quell-ID der Bank. Nur angeben, wenn sie bei jedem Abruf gleich bleibt.
        bookingDate:
          type: string
          format: date
          example: 2026-11-03
        valueDate:
          type: string
          format: date
          example: 2026-11-03
        amountCents:
          type: integer
          minimum: -100000000000
          maximum: 100000000000
          description: Betrag in Cent; negativ = Ausgang
          example: -1299
        currency:
          type: string
          enum:
            - EUR
          default: EUR
        counterpartyName:
          type: string
          maxLength: 300
        counterpartyIban:
          type: string
          example: DE02120300000000202051
        purpose:
          type: string
          maxLength: 2000
      required:
        - bookingDate
        - amountCents
    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        sourceId:
          type:
            - string
            - "null"
        bookingDate:
          type: string
          format: date
          example: 2026-11-03
        valueDate:
          type:
            - string
            - "null"
          format: date
          example: 2026-11-03
        amountCents:
          type: integer
        currency:
          type: string
          enum:
            - EUR
        counterpartyName:
          type:
            - string
            - "null"
        counterpartyIban:
          type:
            - string
            - "null"
        purpose:
          type:
            - string
            - "null"
        status:
          type: string
          enum:
            - importiert
            - vorgeschlagen
            - bestaetigt
          description: importiert = noch ohne Aufteilung; vorgeschlagen = Aufteilung aus Regel oder LLM, zählt schon im Budget; bestaetigt = von einer Person bestätigt oder korrigiert
        recurringSeriesId:
          type:
            - string
            - "null"
          format: uuid
        splits:
          type: array
          items:
            $ref: "#/components/schemas/Split"
        suggestion:
          $ref: "#/components/schemas/Suggestion"
      required:
        - id
        - accountId
        - sourceId
        - bookingDate
        - valueDate
        - amountCents
        - currency
        - counterpartyName
        - counterpartyIban
        - purpose
        - status
        - recurringSeriesId
        - splits
        - suggestion
    Split:
      type: object
      properties:
        kind:
          type: string
          enum:
            - topf
            - einnahme
            - umbuchung
            - einzahlung
            - ausgleich
          description: topf = Ausgabe oder Erstattung eines Topfs (von privaten Konten auch ein Topf des gemeinsamen Haushalts, daraus entsteht ein Ausgleich); einnahme = fließt in „Noch ohne Aufgabe“; umbuchung = zwischen eigenen Konten desselben Haushalts, ohne Wirkung aufs Budget; einzahlung = vom privaten aufs gemeinsame Konto (privat ein Ausgang, gemeinsam ein Eingang); ausgleich = Erstattung einer privat bezahlten gemeinsamen Ausgabe (gemeinsam ein Ausgang, privat ein Eingang), ohne Wirkung aufs Budget
        potId:
          type:
            - string
            - "null"
          format: uuid
          description: nur bei kind = topf
        personId:
          type:
            - string
            - "null"
          format: uuid
          description: "nur bei einzahlung und ausgleich auf gemeinsamen Konten: von wem bzw. an wen das Geld geht"
        counterAccountId:
          type:
            - string
            - "null"
          format: uuid
          description: "nur bei umbuchung: Gegenkonto im selben Haushalt, z. B. das Bargeldkonto bei einer Abhebung (zählt dann im Bargeldbestand); null = unbekannt"
        amountCents:
          type: integer
          minimum: -100000000000
          maximum: 100000000000
          description: Betrag in Cent; negativ = Ausgang
          example: -1299
      required:
        - kind
        - potId
        - personId
        - counterAccountId
        - amountCents
    Suggestion:
      type:
        - object
        - "null"
      properties:
        source:
          type: string
          enum:
            - regel
            - abgleich
            - llm
          description: abgleich = Überweisung zwischen eigenen Konten, über die IBAN erkannt
        kind:
          type: string
          enum:
            - topf
            - einnahme
            - umbuchung
            - einzahlung
            - ausgleich
          description: topf = Ausgabe oder Erstattung eines Topfs (von privaten Konten auch ein Topf des gemeinsamen Haushalts, daraus entsteht ein Ausgleich); einnahme = fließt in „Noch ohne Aufgabe“; umbuchung = zwischen eigenen Konten desselben Haushalts, ohne Wirkung aufs Budget; einzahlung = vom privaten aufs gemeinsame Konto (privat ein Ausgang, gemeinsam ein Eingang); ausgleich = Erstattung einer privat bezahlten gemeinsamen Ausgabe (gemeinsam ein Ausgang, privat ein Eingang), ohne Wirkung aufs Budget
        potId:
          type:
            - string
            - "null"
          format: uuid
        personId:
          type:
            - string
            - "null"
          format: uuid
        counterAccountId:
          type:
            - string
            - "null"
          format: uuid
        confidencePct:
          type: integer
          minimum: 0
          maximum: 100
        reason:
          type: string
          description: Begründung in einem Satz
        ruleId:
          type:
            - string
            - "null"
          format: uuid
      required:
        - source
        - kind
        - potId
        - personId
        - counterAccountId
        - confidencePct
        - reason
        - ruleId
    RecurringSeries:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        counterparty:
          type: string
        direction:
          type: string
          enum:
            - eingang
            - ausgang
        cadence:
          type: string
          enum:
            - woechentlich
            - zweiwoechentlich
            - monatlich
            - quartalsweise
            - halbjaehrlich
            - jaehrlich
        typicalAmountCents:
          type: integer
          description: Median der Beträge
        minAmountCents:
          type: integer
        maxAmountCents:
          type: integer
        occurrences:
          type: integer
        firstDate:
          type: string
          format: date
          example: 2026-11-03
        lastDate:
          type: string
          format: date
          example: 2026-11-03
        nextExpectedDate:
          type: string
          format: date
          example: 2026-11-03
        state:
          type: string
          enum:
            - aktiv
            - beendet
          description: beendet = nächste Buchung deutlich überfällig (z. B. gekündigtes Abo)
      required:
        - id
        - accountId
        - counterparty
        - direction
        - cadence
        - typicalAmountCents
        - minAmountCents
        - maxAmountCents
        - occurrences
        - firstDate
        - lastDate
        - nextExpectedDate
        - state
    Pot:
      type: object
      properties:
        id:
          type: string
          format: uuid
        householdId:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum:
            - monatlich
            - ruecklage
            - ziel
            - erst_ich
          description: monatlich = Monatsbudget (amountCents je Monat, optional); ruecklage = unregelmäßige Kosten (amountCents je Jahr, Monatsrate = ein Zwölftel); ziel = Zielbetrag (amountCents) bis targetMonth; erst_ich = wird nach jeder Einnahme zuerst gefüllt (amountCents je Monat oder percentBp der Einnahmen des Monats)
        groupName:
          type:
            - string
            - "null"
        amountCents:
          type:
            - integer
            - "null"
        percentBp:
          type:
            - integer
            - "null"
        targetMonth:
          type:
            - string
            - "null"
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          example: 2026-11
        sortOrder:
          type: integer
        archived:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - householdId
        - name
        - kind
        - groupName
        - amountCents
        - percentBp
        - targetMonth
        - sortOrder
        - archived
        - createdAt
    BudgetStart:
      type: object
      properties:
        householdId:
          type: string
          format: uuid
        month:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          example: 2026-11
          description: Startmonat; Buchungen davor zählen nicht im Budget
        openingBalanceCents:
          type: integer
          description: Anfangsbestand = Summe der Konten; Konten ohne Kontostand zählen mit 0
        accounts:
          type: array
          items:
            type: object
            properties:
              accountId:
                type: string
                format: uuid
              name:
                type: string
              balance:
                type:
                  - object
                  - "null"
                properties:
                  cents:
                    type: integer
                  date:
                    type: string
                    format: date
                    example: 2026-11-03
                    description: Stand am Ende dieses Tages
                  source:
                    type: string
                    enum:
                      - manuell
                      - anbieter
                required:
                  - cents
                  - date
                  - source
                description: Bekannter Kontostand
              openingBalanceCents:
                type:
                  - integer
                  - "null"
                description: "Stand zu Beginn des Startmonats: Kontostand − Buchungen ab Startmonat bis zum Stichtag; null ohne Kontostand"
            required:
              - accountId
              - name
              - balance
              - openingBalanceCents
      required:
        - householdId
        - month
        - openingBalanceCents
        - accounts
    BudgetMonth:
      type: object
      properties:
        householdId:
          type: string
          format: uuid
        month:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          example: 2026-11
        budgetStartMonth:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          example: 2026-11
          description: Budgetbeginn des Haushalts; Monate davor sind leer
        closedAt:
          type:
            - string
            - "null"
          format: date-time
        readyToAssignCents:
          type: integer
          description: "„Noch ohne Aufgabe“: Anfangsbestand + Einnahmen bis zum Monat − Einzahlungen ins Gemeinsame − alle Zuweisungen (auch spätere Monate) − Überziehung der Vormonate"
        openingBalanceCents:
          type: integer
          description: Anfangsbestand (Summe der Kontostände zum Budgetbeginn), nur im Startmonat, sonst 0. Zählt zu „Noch ohne Aufgabe“, nicht zu den Einnahmen
        inflowsCents:
          type: integer
          description: Einnahmen im Monat; im gemeinsamen Haushalt samt Einzahlungen der Personen
        contributionsCents:
          type: integer
          description: Einzahlungen ins Gemeinsame im Monat (negativ, nur privat); mindern „Noch ohne Aufgabe“
        assignedCents:
          type: integer
        activityCents:
          type: integer
        overspentPreviousCents:
          type: integer
          description: Überziehung im Vormonat, mindert „Noch ohne Aufgabe“
        assignedInFutureCents:
          type: integer
        unconfirmedTransactions:
          type: integer
        pots:
          type: array
          items:
            $ref: "#/components/schemas/BudgetPot"
      required:
        - householdId
        - month
        - budgetStartMonth
        - closedAt
        - readyToAssignCents
        - openingBalanceCents
        - inflowsCents
        - contributionsCents
        - assignedCents
        - activityCents
        - overspentPreviousCents
        - assignedInFutureCents
        - unconfirmedTransactions
        - pots
    BudgetPot:
      type: object
      properties:
        potId:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum:
            - monatlich
            - ruecklage
            - ziel
            - erst_ich
          description: monatlich = Monatsbudget (amountCents je Monat, optional); ruecklage = unregelmäßige Kosten (amountCents je Jahr, Monatsrate = ein Zwölftel); ziel = Zielbetrag (amountCents) bis targetMonth; erst_ich = wird nach jeder Einnahme zuerst gefüllt (amountCents je Monat oder percentBp der Einnahmen des Monats)
        groupName:
          type:
            - string
            - "null"
        archived:
          type: boolean
        carryoverCents:
          type: integer
          description: Übertrag aus dem Vormonat, ≥ 0
        assignedCents:
          type: integer
        assignmentSource:
          type:
            - string
            - "null"
          enum:
            - manuell
            - automatik
            - null
        activityCents:
          type: integer
          description: Summe der Aufteilungen im Monat (Ausgaben negativ)
        availableCents:
          type: integer
          description: Übertrag + Zuweisung + Aufteilungen; negativ = überzogen
        planCents:
          type: integer
          description: Was der Plan für den Monat vorsieht
        neededCents:
          type: integer
          description: Davon noch nicht zugewiesen
      required:
        - potId
        - name
        - kind
        - groupName
        - archived
        - carryoverCents
        - assignedCents
        - assignmentSource
        - activityCents
        - availableCents
        - planCents
        - neededCents
    Rule:
      type:
        - object
        - "null"
      properties:
        id:
          type: string
          format: uuid
        householdId:
          type: string
          format: uuid
        accountId:
          type:
            - string
            - "null"
          format: uuid
        direction:
          type:
            - string
            - "null"
          enum:
            - eingang
            - ausgang
            - null
        counterpartyIban:
          type:
            - string
            - "null"
        counterpartyName:
          type:
            - string
            - "null"
          description: Gleichheit ohne Groß-/Kleinschreibung
        purposeContains:
          type:
            - string
            - "null"
        minAmountCents:
          type:
            - integer
            - "null"
        maxAmountCents:
          type:
            - integer
            - "null"
        kind:
          type: string
          enum:
            - topf
            - einnahme
            - umbuchung
            - einzahlung
            - ausgleich
          description: topf = Ausgabe oder Erstattung eines Topfs (von privaten Konten auch ein Topf des gemeinsamen Haushalts, daraus entsteht ein Ausgleich); einnahme = fließt in „Noch ohne Aufgabe“; umbuchung = zwischen eigenen Konten desselben Haushalts, ohne Wirkung aufs Budget; einzahlung = vom privaten aufs gemeinsame Konto (privat ein Ausgang, gemeinsam ein Eingang); ausgleich = Erstattung einer privat bezahlten gemeinsamen Ausgabe (gemeinsam ein Ausgang, privat ein Eingang), ohne Wirkung aufs Budget
        potId:
          type:
            - string
            - "null"
          format: uuid
        personId:
          type:
            - string
            - "null"
          format: uuid
        counterAccountId:
          type:
            - string
            - "null"
          format: uuid
        origin:
          type: string
          enum:
            - korrektur
            - manuell
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - householdId
        - accountId
        - direction
