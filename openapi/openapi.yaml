    put:
      tags:
        - Kategorisierung
      summary: Aufteilung festlegen (korrigieren) und bestätigen
      description: Die Summe der Aufteilungen muss dem Buchungsbetrag entsprechen; Töpfe kommen aus dem Haushalt des Kontos. Weicht eine einfache Zuordnung vom Vorschlag ab, entsteht eine Regel für die Gegenpartei (außer learn = false), und offene Buchungen werden neu vorgeschlagen.
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: transactionId
          in: path
      requestBody:
        description: Aufteilung
        content:
          application/json:
            schema:
              type: object
              properties:
                splits:
                  type: array
                  items:
                    $ref: "#/components/schemas/Split"
                  minItems: 1
                  maxItems: 50
                learn:
                  type: boolean
                  default: true
              required:
                - splits
      responses:
        "200":
          description: Bestätigte Buchung
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction:
                    $ref: "#/components/schemas/Transaction"
                  rule:
                    $ref: "#/components/schemas/Rule"
                  resuggested:
                    type: integer
                    description: offene Buchungen, die die Regel neu vorgeschlagen hat
                required:
                  - transaction
                  - rule
                  - resuggested
        "400":
          description: Ungültige Anfrage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Buchung nicht gefunden (oder kein Zugriff)
          content:
