name: Backend

on:
  push:
    branches: [main]
    paths: ['backend/**', 'web/**', 'openapi/**', '.dockerignore', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'openapi/**', '.github/workflows/backend.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: freiraum
          POSTGRES_PASSWORD: freiraum
          POSTGRES_DB: freiraum
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U freiraum" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://freiraum:freiraum@localhost:5432/freiraum_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # Prüft u. a., dass openapi/openapi.yaml zum Code passt.
      - run: pnpm test

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          # Kontext = Repo-Wurzel: Das Image enthält auch die Web-Oberfläche aus web/ (ADR 0007).
          context: .
          file: backend/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/freiraum-backend:main
            ghcr.io/${{ github.repository_owner }}/freiraum-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Der Homelab-Server holt das Deployment per Pull ab (deploy-agent) und rollt
  # ghcr.io/rubenvitt/freiraum-backend:<SHA> aus. Kein Runner mit Serverzugang.
  deploy:
    name: Deployment anlegen
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    steps:
      - name: Deployment anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/deployments" --jq .id --input - <<JSON
          {"ref": "${{ github.sha }}", "environment": "production", "auto_merge": false,
           "required_contexts": [], "payload": {"tag": "${{ github.sha }}"},
           "description": "Image ghcr.io/${{ github.repository_owner }}/freiraum-backend:${{ github.sha }}"}
          JSON
          )
          gh api "repos/${{ github.repository }}/deployments/$id/statuses" -f state=queued \
            -f description="wartet auf den deploy-agent des Servers" > /dev/null
          echo "Deployment $id angelegt"
